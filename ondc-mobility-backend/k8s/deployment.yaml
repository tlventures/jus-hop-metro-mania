apiVersion: apps/v1
kind: Deployment
metadata:
  name: ondc-mobility-bnp-core
  namespace: ticketing
  labels:
    app: ondc-mobility-bnp-core
    tier: backend
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ondc-mobility-bnp-core
  template:
    metadata:
      labels:
        app: ondc-mobility-bnp-core
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - ondc-mobility-bnp-core
                topologyKey: kubernetes.io/hostname
      containers:
        - name: bnp-core
          image: gcr.io/ticketbook-prod/ondc-mobility-bnp-core:v2.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - secretRef:
                name: ondc-bnp-secrets
            - configMapRef:
                name: ondc-bnp-config
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: ondc-mobility-bnp-service
  namespace: ticketing
  labels:
    app: ondc-mobility-bnp-core
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: ondc-mobility-bnp-core
