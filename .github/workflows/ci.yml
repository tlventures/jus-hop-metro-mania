name: CI

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  flutter:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Informational only — the existing codebase is not uniformly dart-format
      # clean. Flip to --set-exit-if-changed once a one-time `dart format` lands.
      - name: Check formatting (non-blocking)
        run: dart format --output=none lib test || true

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded

  backend:
    name: Backend test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test
